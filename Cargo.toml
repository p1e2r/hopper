[package]
name = "hopper"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "A small Minecraft mod, resource pack and shader manager that attaches to your existing .minecraft folder"

[dependencies]
gpui = "0.2.2"
unicode-segmentation = "1"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
toml = "0.8"
trash = "5"
sha1 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# gpui pulls in xattr 0.2.3, which no longer compiles on Linux against current
# libc. vendor/xattr is that crate with a one-line fix.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
